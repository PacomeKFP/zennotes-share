[project]
name = "zennotes-share"
version = "0.1.0"
description = "Ephemeral note sharing sidecar for ZenNotes (Modal, scale-to-zero)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "markdown>=3.7",
  "bleach>=6.1",
  "pygments>=2.19,<2.21",
  "pymdown-extensions==11.0.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
